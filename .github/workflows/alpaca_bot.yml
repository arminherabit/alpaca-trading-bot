name: Alpaca Day Trading Bot

on:
  schedule:
    # Sparse BACKUP cron only — cron-job.org is the primary trigger. A swing
    # bot holding multi-day positions does not need frequent scans, and a
    # dense backup cron just adds load during GitHub runner-capacity crunches.
    # Hourly on the hour during market hours is a sufficient safety net.
    - cron: '5 13-20 * * 1-5'
  workflow_dispatch:        # Manual trigger from GitHub UI
  repository_dispatch:      # External trigger via GitHub API (cron-job.org)
    types: [run-bot]

permissions:
  contents: write      # Needed to commit state back to repo

# Opt into Node.js 24 now — GitHub forces this on June 2 2026 anyway.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Do NOT use cancel-in-progress — it causes runner starvation on free tier.
# Instead let each run complete; the bot itself is idempotent.
concurrency:
  group: alpaca-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # Hard cap — fail fast if runner stalls

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # PowerShell ships preinstalled on ubuntu-latest, so this is a no-op on a
      # healthy runner. It used to run `apt-get update` unconditionally under
      # `bash -e`, which meant ANY unhealthy apt source on the image killed the
      # whole scan: on 2026-09-09 a hash-sum mismatch on Google's Chrome repo --
      # nothing to do with this bot -- failed four consecutive runs. Skip the
      # install when pwsh is present, and never let a broken third-party repo
      # index be fatal.
      - name: Ensure PowerShell
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            echo "pwsh already present: $(pwsh --version)"
            exit 0
          fi
          echo "pwsh missing -- installing"
          sudo apt-get update -qq || echo "apt-get update reported errors; continuing"
          sudo apt-get install -y powershell
          command -v pwsh >/dev/null 2>&1 || { echo "::error::PowerShell install failed"; exit 1; }

      - name: Run Alpaca bot scan
        shell: pwsh
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: pwsh ./alpaca_bot.ps1 -Once

      - name: Generate dashboard
        shell: pwsh
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: pwsh ./alpaca_dashboard_html.ps1 -GenerateOnly

      # Public status page (docs/index.html), served by GitHub Pages once Pages
      # is pointed at the /docs folder. Built here on the runner, so the page
      # keeps updating with no developer machine involved.
      - name: Build status page
        shell: pwsh
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: pwsh ./alpaca_pages.ps1

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-dashboard
          path: alpaca_dashboard.html
          retention-days: 7
          overwrite: true

      - name: Persist state to repo
        run: |
          git config user.name  "alpaca-bot[bot]"
          git config user.email "alpaca-bot@users.noreply.github.com"
          git add -f alpaca_state.json alpaca_dashboard.html alpaca_ticker_memory.json earnings_calendar.json alpaca_journal.json alpaca_review.md alpaca_equity_history.json docs/index.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "alpaca: state + memory + dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push || true
