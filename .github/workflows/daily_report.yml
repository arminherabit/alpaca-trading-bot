name: Daily EOD Report Email

# Fires once after the US market close on trading days. GitHub's scheduler
# can run a few minutes late or (rarely) skip -- acceptable for a daily
# summary. 20:10 UTC = 4:10 PM ET during EDT; a second entry at 21:10 UTC
# covers EST (standard time, when 4 PM ET = 21:00 UTC). The send-once guard
# in the job dedupes if both happen to fire.
on:
  schedule:
    - cron: '10 20 * * 1-5'   # 4:10 PM ET (EDT)
    - cron: '10 21 * * 1-5'   # 4:10 PM ET (EST)
  workflow_dispatch:           # Manual "send me one now" from the Actions tab

permissions:
  contents: read

concurrency:
  group: alpaca-daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Only the cron entry that lands in the 4 PM ET hour proceeds, so the
      # EDT (20:10 UTC) and EST (21:10 UTC) entries never both send. Manual
      # dispatch always proceeds.
      - name: Gate to 4 PM ET (once/day across DST)
        id: gate
        run: |
          H=$(TZ=America/New_York date +%H)
          echo "et_hour=$H"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "16" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4

      - name: Install PowerShell
        if: steps.gate.outputs.go == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y powershell

      - name: Generate EOD report
        if: steps.gate.outputs.go == 'yes'
        shell: pwsh
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: pwsh ./alpaca_daily_report.ps1

      - name: Read report into env
        if: steps.gate.outputs.go == 'yes'
        id: report
        run: |
          {
            echo 'BODY<<EOF'
            cat alpaca_daily_report.txt
            echo EOF
          } >> "$GITHUB_ENV"
          echo "SUBJECT=Alpaca bot -- daily report $(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Send email
        if: steps.gate.outputs.go == 'yes'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_SERVER }}
          server_port:    ${{ secrets.MAIL_SMTP_PORT }}
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          from:           Alpaca Bot <${{ secrets.MAIL_USERNAME }}>
          to:             ${{ secrets.MAIL_TO }}
          subject:        ${{ env.SUBJECT }}
          body:           ${{ env.BODY }}
